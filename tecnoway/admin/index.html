<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Administração | Tecnoway</title>
	<link rel="icon" href="brand.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="admin-theme.css">
</head>
<body>
	<script src="https://unpkg.com/decap-cms@^3.8.3/dist/decap-cms.js"></script>
	<script>
		CMS.registerPreviewStyle("admin-preview.css");

		// Mensagens de erro do servidor de autenticação (DecapBridge) chegam em inglês
		// e o Decap as exibe sem traduzir. Trocamos o texto assim que aparece na tela.
		(function () {
			var traducoes = [
				[/INVALID_CREDENTIALS|Invalid user credentials|invalid_grant/i, "Usuário/Senha inválidos"],
				[/Failed to fetch|NetworkError|Network request failed/i, "Não foi possível conectar ao servidor. Verifique sua internet e tente novamente."],
				[/Email not confirmed/i, "E-mail ainda não confirmado. Verifique sua caixa de entrada."],
				[/too many requests|rate limit/i, "Muitas tentativas. Aguarde um instante e tente novamente."]
			];
			function traduzir(no) {
				var texto = no.textContent;
				if (!texto) return;
				for (var i = 0; i < traducoes.length; i++) {
					if (traducoes[i][0].test(texto)) { no.textContent = traducoes[i][1]; return; }
				}
			}
			function varrer(raiz) {
				var pagina = raiz.querySelector ? raiz.querySelector('[class*="-StyledAuthenticationPage"]') : null;
				if (!pagina) return;
				pagina.querySelectorAll('p, span, div').forEach(function (el) {
					if (el.children.length === 0) traduzir(el);
				});
			}
			new MutationObserver(function () { varrer(document); }).observe(document.body, { childList: true, subtree: true, characterData: true });
		})();
	</script>
</body>
</html>
