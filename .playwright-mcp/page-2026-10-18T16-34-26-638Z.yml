            - generic [ref=f8e245]:
              - heading [level=2] [ref=f8e246]:
                - strong [ref=f8e247]: Nossa história
              - paragraph [ref=f8e248]:
                - text: Fundada em 1977, a
                - strong [ref=f8e249]: Decarlo
                - text: construiu uma trajetória de quase cinco décadas de evolução, especializando-se em usinagem e fabricação de peças seriadas para a indústria. Com tecnologia de ponta, estrutura moderna e foco em qualidade e eficiência, consolidou-se como referência no setor.
            - generic [ref=f8e255]:
              - generic [ref=f8e256]:
                - group "1 / 8" [ref=f8e257]:
                  - img "1990 - Fundação" [ref=f8e258]
                  - heading "1977" [level=2] [ref=f8e259]
                  - paragraph [ref=f8e260]: Fundada como Retificadora De Carlo, a empresa iniciou suas atividades especializada na retífica de tambores e discos de freio, consolidando sua reputação pela qualidade e precisão dos serviços prestados.
                - group "2 / 8" [ref=f8e261]:
                  - heading "1980" [level=2] [ref=f8e263]
                  - paragraph [ref=f8e264]: A empresa amplia seu portfólio de serviços, deixando de atuar exclusivamente no segmento de freios para atender a diversos setores da indústria por meio de soluções em usinagem de precisão.
                - group "3 / 8" [ref=f8e265]:
                  - heading "1990" [level=2] [ref=f8e267]
                  - paragraph [ref=f8e268]: A companhia passa a adotar oficialmente a razão social De Carlo Peças Ltda., fortalecendo sua identidade e posicionamento no mercado industrial.
                - group "4 / 8" [ref=f8e269]:
                  - heading "1990" [level=2] [ref=f8e271]
                  - paragraph [ref=f8e272]: A fabricação seriada de componentes para a indústria automobilística torna-se a principal atividade da empresa, consolidando sua expertise em produção de alta qualidade e elevada confiabilidade.
                - group "5 / 8" [ref=f8e273]:
                  - heading "2007" [level=2] [ref=f8e275]
                  - paragraph [ref=f8e276]: Tem início a construção do novo parque fabril, localizado na Vila Industrial, em Mogi das Cruzes - SP, ampliando sua capacidade produtiva e fortalecendo sua presença no mercado nacional.
                - group "6 / 8" [ref=f8e277]:
                  - heading "2024" [level=2] [ref=f8e279]
                  - paragraph [ref=f8e280]: Após décadas de gestão familiar, a empresa passa a integrar um grupo de investidores da Grande São Paulo, marcando o início de uma nova fase de crescimento estratégico.
                - group "7 / 8" [ref=f8e281]:
                  - heading "2025" [level=2] [ref=f8e283]
                  - paragraph [ref=f8e284]: Sob nova administração e com investimentos em tecnologia, inovação e modernização, inicia-se um novo ciclo de desenvolvimento pautado pela excelência, qualidade e compromisso com seus clientes.
                - group "8 / 8" [ref=f8e285]:
                  - heading "2026" [level=2] [ref=f8e287]
                  - paragraph [ref=f8e288]: A empresa passa a adotar a marca Decarlo Industrial, refletindo sua evolução, fortalecimento no mercado e compromisso contínuo com inovação, tecnologia e excelência em soluções industriais.
