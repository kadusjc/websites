            - heading [level=2] [ref=f8e145]:
              - strong [ref=f8e146]: Localização estratégica e privilegiada para operações logísticas
            - generic [ref=f8e147]: COMO CHEGAR
            - paragraph [ref=f8e150]:
              - text: A
              - strong [ref=f8e151]: Decarlo Industrial
              - text: está estrategicamente localizada em Mogi das Cruzes-SP, um dos principais polos logísticos do estado de São Paulo, oferecendo excelente conectividade com os principais aeroportos do país e uma ampla malha rodoviária, fundamental para o transporte e a distribuição de cargas em todo o território nacional. Sua posição privilegiada também facilita o acesso às principais cidades portuárias, contribuindo para a eficiência das operações de comércio nacional e internacional.
            - paragraph [ref=f8e152]:
              - strong [ref=f8e153]: Conectividade Rodoviária e Marítima
            - paragraph [ref=f8e154]: "Rodovia Ayrton Senna (SP-070): principal via de acesso para quem se desloca a partir da cidade de São Paulo."
            - paragraph [ref=f8e155]: "Rodovia Mogi-Dutra (SP-088): importante ligação com a Rodovia Presidente Dutra, permitindo a distribuição de mercadorias para diversas regiões do país."
            - paragraph [ref=f8e156]: "Rodovia Mogi-Bertioga (SP-098): proporciona conexão direta com as cidades do litoral, como Bertioga, além de acesso facilitado ao Porto de Santos, o maior e mais movimentado porto da América Latina."
            - paragraph [ref=f8e157]:
              - strong [ref=f8e158]: Acessibilidade Aérea
            - paragraph [ref=f8e159]: "Aeroporto Internacional de Guarulhos (GRU): localizado a apenas 32 km, é o principal aeroporto brasileiro para voos internacionais."
            - paragraph [ref=f8e160]: "Aeroporto de Congonhas (CGH): situado a 49 km, é um dos mais importantes centros de operações de voos domésticos do país."
            - paragraph [ref=f8e161]: "Aeroporto Internacional de Viracopos (VCP): a 113 km, em Campinas, é um dos maiores terminais de carga aérea da América do Sul e opera voos domésticos e internacionais."
            - paragraph [ref=f8e162]:
              - text: Essa combinação estratégica de conexões terrestres, marítimas e aéreas posiciona a
              - strong [ref=f8e163]: Decarlo
              - text: em um local privilegiado para operações de logística, comércio e distribuição, assegurando maior eficiência, agilidade e competitividade para atender às demandas de seus clientes em todo o Brasil e no mercado internacional.
