            - generic [ref=f8e306]:
              - paragraph [ref=f8e307]
              - heading [level=2] [ref=f8e308]:
                - strong [ref=f8e309]: MISSÃO
              - separator [ref=f8e310]
              - paragraph [ref=f8e311]: Impulsionar a eficiência e a inovação em usinagem, promovendo a modernização contínua dos processos produtivos e a busca permanente por novas tecnologias e soluções de alto valor agregado.
            - generic [ref=f8e312]:
              - paragraph [ref=f8e313]
              - heading [level=2] [ref=f8e314]:
                - strong [ref=f8e315]: VISÃO
              - separator [ref=f8e316]
              - paragraph [ref=f8e317]: Ser reconhecida como referência no setor de usinagem pela excelência operacional, agilidade e capacidade de inovação, destacando-se no desenvolvimento de novos produtos e processos. Buscamos consolidar nossa presença no mercado por meio da aplicação de tecnologias avançadas, práticas sustentáveis e de uma gestão da qualidade baseada em riscos, gerando valor para clientes, colaboradores e parceiros.
            - generic [ref=f8e318]:
              - paragraph [ref=f8e319]
              - heading [level=2] [ref=f8e320]:
                - strong [ref=f8e321]: VALORES
              - separator [ref=f8e322]
              - paragraph [ref=f8e323]: Credibilidade e transparência em todas as relações; Responsabilidade social e respeito ao meio ambiente; Compromisso com os requisitos regulatórios e as expectativas dos clientes; Ética, honestidade e integridade profissional; Pontualidade e excelência nas entregas; Valorização das pessoas e incentivo ao aprendizado contínuo; Criatividade e inovação como impulsionadores do crescimento; Trabalho em equipe e colaboração para resultados eficientes; Cultura de prevenção, gestão de riscos e melhoria contínua; Compromisso com a qualidade, a eficiência e a sustentabilidade
