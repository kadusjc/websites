<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&amp;display=swap');
      .title {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -0.015em;
        fill: #ffffff;
      }
      .sub {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.38em;
        fill: #ef4444;
      }
      .badge {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 800;
        font-size: 9px;
        letter-spacing: 0.18em;
        fill: #000000;
      }
    </style>
  </defs>

  <!-- Diamond Icon -->
  <g transform="translate(4, 2)">
    <path d="M 50 6 L 90 46 L 74 46 L 50 22 L 26 46 L 10 46 Z" fill="#ffffff" stroke-linejoin="round" />
    <path d="M 50 90 L 10 50 L 26 50 L 50 74 L 74 50 L 90 50 Z" fill="#ffffff" stroke-linejoin="round" />
    <rect x="8" y="41" width="84" height="14" rx="2" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    <text x="50" y="51.5" text-anchor="middle" class="badge">DESDE 2001</text>
  </g>

  <!-- Text Lockup -->
  <g transform="translate(120, 0)">
    <text x="0" y="58" class="title">ADERIC</text>
    <text x="2" y="88" class="sub">COMERCIAL</text>
  </g>
</svg>